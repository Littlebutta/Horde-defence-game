[package]
name = "pixel-horde"
version = "0.4.0"
edition = "2021"
description = "Horde defence where every enemy is a single pixel"

[[bin]]
name = "PixelHorde"
path = "src/main.rs"

[dependencies]
macroquad = "0.4"
rayon = "1"
ureq = { version = "2", features = ["json", "gzip"] }
serde_json = "1"
earcutr = "0.4"
libm = "0.2"
miniz_oxide = "0.8"
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "wav"] }
steamworks = { version = "0.13", optional = true, features = ["raw-bindings"] }
igd-next = "0.18"

[build-dependencies]
winresource = "0.1"

[features]
default = ["steam"]
steam = ["dep:steamworks"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2

# miniquad with a 24-bit depth buffer for render targets (see vendor/miniquad, "patched for Pixel Horde")
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
